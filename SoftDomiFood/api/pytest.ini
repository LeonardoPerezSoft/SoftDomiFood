[pytest]
# Configuración de pytest para SoftDomiFood API

# Modo asyncio para tests asíncronos
asyncio_mode = auto

# Directorio raíz de tests
testpaths = tests

# Patrones de descubrimiento de archivos de tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers personalizados
markers =
    unit: Tests unitarios (lógica aislada, sin DB)
    integration: Tests de integración (con DB, endpoints)
    e2e: Tests end-to-end (flujos completos)
    slow: Tests lentos (> 5 segundos)
    rabbitmq: Tests que requieren RabbitMQ
    admin: Tests de endpoints administrativos
    auth: Tests de autenticación

# Opciones de cobertura
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=services.auth_service
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=70
    -ra

# Configuración de logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Configuración de warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Timeout para tests (evitar tests colgados)
timeout = 30

# Configuración de xdist para ejecución paralela
# Descomentar para usar: pytest -n auto
# addopts = -n auto
